    event.preventDefault();const form=new FormData(event.currentTarget);$('project-save').disabled=true;
    if (libraryPicker) {
      $('project-dialog').close();startLibrary('library.add',undefined,{sources:[...picked]});return;
    }
    desktopBridge.postMessage({type:'project.save',id:editProject?.id,request:{name:form.get('name'),objective:form.get('objective'),since:form.get('since'),sources:[...picked]}});
  });
  $('project-analyze-form').addEventListener('submit',event=>{
    event.preventDefault();$('project-consent').close();
    desktopBridge.postMessage({type:'project.analyze',id:consentProject.id,request:{revision:consentProject.revision,model_authorized:true}});
  });
  chooseMode('projects');
}
const taskErrors={task_runtime_missing:'工作台找不到本机的 Python 或调查 CLI。',codex_cli_not_found:'找不到本机的 Codex CLI。',
  codex_run_failed:'Codex 运行失败，已写入的发现仍可查看。',sensitive_query_rejected:'请输入公开身份关键词，移除敏感信息。',
  one_to_twelve_public_queries_required:'请填写 1 至 12 条公开查询词。',task_already_running:'该任务仍在运行。',
  task_not_running:'该任务当前没有运行。',invalid_task_profile_url:'请输入有效的公开主页链接。',
  codex_review_invalid:'Codex 审阅结果无法解析。',codex_review_unfetched_source:'审阅结果引用了未抓取的来源。',
  use_short_public_identity_keywords_not_chat_transcripts:'请填写简短的对象、目标和查询词。'};
const taskStates={ready:['待运行','grey'],running:['运行中','green'],completed:['报告已更新','green'],stopped:['已停止','grey'],
  failed:['失败','red'],no_report:['未生成报告','amber'],interrupted:['已中断','amber']};
function renderTasks(tasks) {
  const list=$('task-list');list.replaceChildren();
  if (!tasks.length) list.append(el('p','task-empty','暂无任务'));
  for (const item of tasks) {
    const row=el('article','task-row');
    const state=item.status==='running'&&Date.now()-Date.parse(item.updated_at)>30000?'interrupted':item.status;
    const title=el('div','task-row-head');
    const phases={searching:'搜索中',fetching:'抓取原文',reviewing:'Codex 审阅',publishing:'发布证据'};
    title.append(el('strong','',item.subject),badge(state==='running'?[phases[item.phase]??'运行中','green']:(taskStates[state]??taskStates.ready)));
    const meta=el('p','task-meta',`${item.searches??0} 次搜索 · ${item.findings??0} 项发现 · ${item.attempt??0} 次运行`);
    const actions=el('div','task-actions');
    if (state==='running') actions.append(button('control','停止',()=>desktopBridge.postMessage({type:'task.stop',id:item.id})));
    if (['ready','failed','stopped','interrupted','no_report'].includes(state)) {
      actions.append(button('control',state==='ready'?'运行':'重试',()=>desktopBridge.postMessage({type:'task.run',id:item.id})));
    }
    const reportIndex=desktopReports.findIndex(report=>report.investigation_id===item.id);
    if (reportIndex>=0) actions.append(button('control','查看证据图',()=>{
      replaceReports(desktopReports);caseIndex=reportIndex;selection={type:'root'};filter='all';setOptions();renderCase();
      $('desktop-demo').textContent='查看示例';$('task-dialog').close();
    }));
    row.append(title,meta);
    if (item.error) row.append(el('p','task-error',taskErrors[item.error]??'本次运行失败'));
    if (actions.children.length) row.append(actions);
    list.append(row);
  }
}
new ResizeObserver(()=>{
  if ((view.clientWidth<575)!==compact) renderCase();
  else fit();
}).observe(view);
</script>
</body>
